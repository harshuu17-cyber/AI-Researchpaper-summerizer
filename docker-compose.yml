services:
  researchlens:
    build:
      context: .
      dockerfile: Dockerfile
    image: researchlens:latest
    container_name: researchlens-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8000
      - CORS_ORIGINS=*
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
